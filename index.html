async function ativarPlayer(){if(state.playerAtivado)return;state.playerAtivado=true;try{const url=URL.createObjectURL(silent());d.bg.src=url;d.bg.loop=true;d.bg.volume=0.001;await d.bg.play();state.bgActive=true;clearInterval(state.bgInterval);state.bgInterval=setInterval(async()=>{try{if(d.bg.paused&&state.bgActive)d.bg.play().catch(()=>{});if(state.playing&&d.audio.paused&&!d.audio.ended&&d.audio.src&&!state.adActive)d.audio.play().catch(()=>{});if(d.audio.ended&&state.playing&&!state.adActive)next();}catch(e){}},1000);if('wakeLock'in navigator){try{state.wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}forcarTelaCheia();iniciarBanner();setTimeout(()=>tocar(),500);}catch(e){state.bgActive=true;forcarTelaCheia();iniciarBanner();setTimeout(()=>tocar(),500);}}
